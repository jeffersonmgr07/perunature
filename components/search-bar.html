<form class="pn-search" id="pnSearchForm">
  <div class="pn-search-tabs">
    <button type="button" class="pn-tab is-active" data-tab="tours" data-i18n="searchBar.tabTours">Tours</button>
    <button type="button" class="pn-tab" data-tab="paquetes" data-i18n="searchBar.tabPackages">Paquetes</button>
    <button type="button" class="pn-tab" data-tab="hoteles" data-i18n="searchBar.tabHotels">Hoteles</button>
  </div>

  <div class="pn-search-box">
    <div class="pn-field pn-field--search">
      <label data-i18n="searchBar.destination">Destino</label>

      <input
        type="text"
        id="pnDestinoInput"
        placeholder="¿A dónde quieres viajar?"
        data-i18n-placeholder="searchBar.destinationPlaceholder"
        autocomplete="off"
      />

      <div class="pn-autocomplete" id="pnAutocomplete"></div>
    </div>

    <div class="pn-field">
      <label data-i18n="searchBar.date">Fecha</label>
      <input type="date" id="pnFecha">
    </div>

    <div class="pn-field">
      <label data-i18n="searchBar.travelers">Viajeros</label>
      <input type="hidden" id="pnViajeros" value="2" />
      <button type="button" class="pn-traveler-toggle" id="pnTravelersToggle" aria-expanded="false" aria-controls="pnTravelersPopover">2 viajeros <span aria-hidden="true">⌄</span></button>
      <div class="pn-traveler-popover" id="pnTravelersPopover" hidden>
        <div class="pn-traveler-row"><div><strong>Adultos</strong><small>12 años o más</small></div><div class="pn-stepper"><button type="button" data-traveler="adults" data-delta="-1" aria-label="Restar adulto">−</button><output id="pnAdultsCount">2</output><button type="button" data-traveler="adults" data-delta="1" aria-label="Agregar adulto">+</button></div></div>
        <div class="pn-traveler-row"><div><strong>Niños</strong><small>Menores de 11 años</small></div><div class="pn-stepper"><button type="button" data-traveler="children" data-delta="-1" aria-label="Restar niño">−</button><output id="pnChildrenCount">0</output><button type="button" data-traveler="children" data-delta="1" aria-label="Agregar niño">+</button></div></div>
        <button type="button" class="pn-traveler-done" id="pnTravelersDone">Listo</button>
      </div>
    </div>

    <button type="submit" class="pn-search-btn" data-i18n="searchBar.searchButton">
      Buscar
    </button>
  </div>
</form>
