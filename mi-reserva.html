<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar reserva | Peru Nature</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./assets/css/variables.css" />
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/header.css" />
  <link rel="stylesheet" href="./assets/css/buttons.css" />
  <link rel="stylesheet" href="./assets/css/footer.css" />
  <link rel="stylesheet" href="./assets/css/auth.css" />
</head>
<body>
  <div id="header-container"></div>
  <main class="auth-page">
    <div class="container lookup-shell">
      <section class="lookup-form">
        <h1 data-i18n="lookup.title">Buscar reserva</h1>
        <p data-i18n="lookup.intro">Ingresa tu código de reserva y el apellido de uno de los pasajeros para ver tu travel voucher sin iniciar sesión.</p>
        <form id="reservationLookupForm">
          <label><span data-i18n="lookup.code">Código de reserva</span><input type="text" name="code" required placeholder="PERD3F1C0" data-i18n-placeholder="lookup.codePlaceholder"></label>
          <label><span data-i18n="lookup.lastname">Apellido del pasajero</span><input type="text" name="lastname" required placeholder="Apellido" data-i18n-placeholder="lookup.lastnamePlaceholder"></label>
          <button type="submit"><i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="lookup.searchButton">Buscar reserva</span></button>
        </form>
        <div class="auth-links">
          <span><span data-i18n="lookup.loginIntro">Si tienes una cuenta, también puedes</span> <a href="./login.html?redirect=perfil.html" data-i18n="lookup.loginLink">iniciar sesión y ver tu historial.</a></span>
        </div>
      </section>
      <section id="reservationLookupResult" class="lookup-card">
        <h2 data-i18n="lookup.resultTitle">Travel voucher</h2>
        <p data-i18n="lookup.resultIntro">El detalle aparecerá aquí después de buscar.</p>
      </section>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/i18n.js"></script>
  <script>window.PN_APPS_SCRIPT_URL = "";</script>
  <script src="./assets/js/pages/mi-reserva.js"></script>
</body>
</html>
