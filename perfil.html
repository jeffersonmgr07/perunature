<body>
  <div id="header-container"></div>
  <main class="auth-page">
    <div class="container">
      <section class="profile-card">
        <div class="profile-top">
          <div>
            <h1 data-i18n="profile.title">Mi perfil</h1>
            <p data-i18n="profile.intro">Consulta tus datos registrados, próximas reservas e historial de viajes.</p>
          </div>
          <button id="logoutButton" class="auth-button auth-button--ghost" type="button"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span data-i18n="profile.logout">Cerrar sesión</span></button>
        </div>
        <div id="profileCustomerInfo" class="profile-meta"></div>
      </section>

      <div class="profile-shell" style="margin-top:24px">
        <section class="profile-panel">
          <h2 data-i18n="profile.upcoming">Próximas reservas</h2>
          <div id="upcomingReservations" class="booking-list"><p data-i18n="profile.loading">Cargando reservas...</p></div>
        </section>
        <section class="profile-panel">
          <h2 data-i18n="profile.history">Historial de viajes</h2>
          <div id="pastReservations" class="booking-list"><p data-i18n="profile.loading">Cargando reservas...</p></div>
        </section>
      </div>
    </div>
  </main>
  <div id="footer-container"></div>
  <script src="./assets/js/app.js"></script>
